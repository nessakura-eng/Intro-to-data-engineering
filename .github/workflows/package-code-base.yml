# Packages the "Code Base" folder into a zip for handoff to Grace Place.
# Run it from the repo's Actions tab: "Package Code Base for Grace Place" > Run workflow.
# It publishes a Release (shown under "Releases" on the repo homepage) with the zip attached,
# and also keeps a copy under "Artifacts" on the run page.
# Secrets and build leftovers are left out: .env files, node_modules, dist, .git.
name: Package Code Base for Grace Place

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the zip
        run: |
          set -e
          stamp=$(date +%Y-%m-%d)
          mkdir -p out
          cd "Code Base"
          zip -r "../out/Grace-Place-Code-Base-$stamp.zip" . \
            -x "node_modules/*" "dist/*" ".git/*" ".env" ".env.*" "*.env.local" ".vercel/*" ".DS_Store"
          cd ..
          echo "Files in the zip:"
          unzip -l "out/Grace-Place-Code-Base-$stamp.zip" | tail -n 25
          if unzip -l "out/Grace-Place-Code-Base-$stamp.zip" | grep -E "\.env"; then
            echo "A secrets file got into the zip. Stopping."; exit 1
          fi

      - name: Keep a copy as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grace-Place-Code-Base
          path: out/*.zip
          retention-days: 30

      - name: Publish a Release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="handoff-$(date +%Y-%m-%d-%H%M)"
          gh release create "$tag" out/*.zip \
            --title "Grace Place handoff $(date +%Y-%m-%d)" \
            --notes "Code Base folder packaged for Grace Place (no secrets, node_modules or build files)."
